---
# Words with no fixed replacement: the right one depends on what is actually
# being replaced. Rewrite the sentence rather than swapping a synonym.
# See STYLE.md#voice.
#
# An error, not a warning: unlike Idioms there is no judgement call to make.
extends: existence
message: "Rewrite without '%s': say what it stands in for here. See STYLE.md#voice."
level: error
ignorecase: true
tokens:
  - 'wholesale'
  - 'load[- ]?bearing'
