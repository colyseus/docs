name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit

      # reads the pinned pnpm version from package.json's "packageManager"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # validates every internal link and anchor, plus the 404.mdx redirect map
      - run: pnpm run check-links

      # llms.txt / sitemap.xml are derived from the sidebar — fail if they weren't regenerated
      - run: pnpm run check:ai-nav

      # terminology (STYLE.md) fails the build; style warnings are reported only
      - uses: errata-ai/vale-action@v2.1.1
        with:
          version: 3.17.1
          files: pages
          fail_on_error: true
          reporter: github-pr-check

      # `next build` occasionally fails page-data collection on a random page
      # and passes on retry — retry once before calling it a real failure
      - run: pnpm run build || pnpm run build
