StylesPath = styles
MinAlertLevel = warning
Vocab = Colyseus

# Vale has no native MDX parser; treat it as Markdown so fenced code blocks and
# frontmatter are skipped the same way.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Colyseus

# Nextra component markup and MDX comments are layout, not prose. The comments
# matter: several document legacy slugs that must keep their old spelling.
BlockIgnores = (?s) *<(Cards|Tabs|Table|Steps|FileTree|ScenarioGrid|DemoGrid|MovedAnchors|SDKTabs)[^>]*>.*?</\1>, \
               (?s) *<(MovedAnchors|Image|ScenarioCard|DemoCard|Cards\.Card)[^>]*/>, \
               (?s) *\{/\*.*?\*/\}

# Inline code spans and JSX attributes are identifiers, not words.
# `filename` is deliberately absent: it appears in code-fence info strings
# (```ts filename="MyRoom.ts"), and blanking it there breaks fence detection.
TokenIgnores = (\x60[^\x60\n]+\x60), \
               ((?:href|src|icon|storageKey)=(?:"[^"]*"|\{[^}]*\}))
