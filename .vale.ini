StylesPath = styles
MinAlertLevel = warning
Vocab = Colyseus

# Vale has no native MDX parser; treat it as Markdown so fenced code blocks and
# frontmatter are skipped the same way.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Colyseus

# Component markup and MDX comments are layout, not prose. The comments
# matter: several document legacy slugs that must keep their old spelling.
BlockIgnores = (?s) *<(Cards|Tabs|Steps|Files)[^>]*>.*?</\1>, \
               (?s) *<(Card|File|Folder|Logo|img)[^>]*/>, \
               (?s) *<include[^>]*>.*?</include>, \
               (?s) *\{/\*.*?\*/\}, \
               import \{[^}]*\} from 'lucide-react';

# Inline code spans and JSX attributes are identifiers, not words.
# `title` is deliberately absent: it appears in code-fence info strings
# (```ts title="MyRoom.ts"), and blanking it there breaks fence detection.
TokenIgnores = (\x60[^\x60\n]+\x60), \
               ((?:href|src|icon|groupId|value)=(?:"[^"]*"|\{[^}]*\}))
